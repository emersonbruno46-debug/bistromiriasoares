<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Bistrô Miriã Soares | Taiobeiras/MG</title>
    <meta
      name="description"
      content="Conheça o Bistrô Miriã Soares em Taiobeiras: massas, risotos, sobremesas, fotos do espaço, horários e localização."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo-bistro-miria-soares.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Schema for Restaurant -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Bistrô Miriã Soares",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Avenida da Liberdade, 389",
          "addressLocality": "Taiobeiras",
          "addressRegion": "MG",
          "addressCountry": "BR"
        },
        "sameAs": [
          "https://www.instagram.com/miriasoaresbistro/"
        ],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Monday",
            "opens": "16:00",
            "closes": "23:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday"],
            "opens": "14:00",
            "closes": "21:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Thursday", "Friday", "Saturday"],
            "opens": "14:00",
            "closes": "23:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
